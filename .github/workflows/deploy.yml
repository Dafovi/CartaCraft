name: Publicar CartaCraft en GitHub Pages

# Exclusivamente manual: subir código no publica automáticamente.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar tipos
        run: npm run check
      - name: Construir web estática
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dafovi.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/CartaCraft/' }}
      - name: Validar rutas y contenido
        run: npm run verify
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://dafovi.github.io' }}
          SITE_BASE: ${{ vars.SITE_BASE || '/CartaCraft/' }}
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir artefacto estático
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
